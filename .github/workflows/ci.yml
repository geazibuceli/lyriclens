name: LyricLens checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e './lyriclens-app/backend[test,tools]'
      - run: python -m pytest lyriclens-app/backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyriclens-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lyriclens-app/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lyriclens-app/frontend/package-lock.json
      - run: pip install -e './lyriclens-app/backend[test,tools,browser]'
      - run: npm ci --prefix lyriclens-app/frontend
      - run: python -m playwright install --with-deps chromium
      - run: python lyriclens-app/scripts/ci_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diagnostics
          path: lyriclens-app/artifacts/
