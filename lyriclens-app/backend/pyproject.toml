[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lyriclens"
version = "0.1.0"
description = "Local multilingual singing transcription"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "python-multipart==0.0.20"]

[project.optional-dependencies]
inference = ["faster-whisper==1.2.1", "huggingface-hub==0.36.0"]
translation = ["ctranslate2==4.8.3", "transformers==4.49.0", "sentencepiece==0.2.1", "safetensors==0.7.0", "torch==2.5.1", "huggingface-hub==0.36.0"]
separation = ["demucs==4.0.1", "torch==2.5.1", "torchaudio==2.5.1", "soundfile==0.13.1"]
test = ["pytest==8.4.2", "httpx==0.28.1"]
evaluation = ["psutil==7.1.0"]
tools = ["imageio-ffmpeg==0.6.0"]
cuda-windows = ["nvidia-cublas-cu12==12.9.2.10; platform_system == 'Windows'", "nvidia-cudnn-cu12==9.27.0.42; platform_system == 'Windows'", "nvidia-cuda-nvrtc-cu12==12.9.86; platform_system == 'Windows'"]
fixtures = ["pyarrow==26.0.0", "fsspec==2026.9.0", "aiohttp==3.14.5"]
browser = ["playwright==1.64.0"]
training = ["transformers==4.49.0", "safetensors==0.7.0", "huggingface-hub==0.36.0", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
include = ["lyriclens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
